apiVersion: apps/v1
kind: Deployment
metadata:
  name: titanic-ml
spec:
  replicas: 1

  selector:
    matchLabels:
      app: titanic-ml

  template:
    metadata:
      labels:
        app: titanic-ml

    spec:
      containers:
        - name: titanic-ml-api
          image: titanic-ml-api:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8000